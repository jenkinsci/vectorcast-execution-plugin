name: Check for debug traces

on:
  pull_request:
    paths:
      - "src/main/resources/scripts/**"

jobs:
  grep-pdb:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6.0.2

    - name: Find pdb.set_trace in bundled Python files
      run: |
        if git grep -n -F 'pdb.set_trace' -- ':(glob)src/main/resources/scripts/**/*.py'; then
          echo "Remove debugger traces from bundled scripts."
          exit 1
        fi
        echo "No debugger traces found."
