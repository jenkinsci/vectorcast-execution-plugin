version: 2
updates:
  # Maven dependency updates for the current development branch.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "tms_081"
    open-pull-requests-limit: 10
    commit-message:
      prefix: ""
    ignore:
      - dependency-name: "org.eclipse.collections:eclipse-collections"
        versions:
          - ">= 10.a"
      - dependency-name: "org.eclipse.collections:eclipse-collections-api"
        versions:
          - ">= 10.a"
      - dependency-name: "net.javacrumbs.json-unit:json-unit-assertj"
        versions:
          - ">= 3.0.0"

      # JUnit updates remain paused pending a separate compatibility audit.
      - dependency-name: "org.junit.jupiter:*"
      - dependency-name: "org.junit.platform:*"
      - dependency-name: "org.junit.vintage:*"
      - dependency-name: "junit:junit"
                                              
  # GitHub Actions - Still on master
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: ""
